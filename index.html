
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distributed Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f5f9;
      color: #222;
    }

    .chat-container {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #34205f;
    }

    h2 {
      font-size: 20px;
      margin-top: 10px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input {
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin-top: 8px;
      background: #5138c4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #3e2a9b;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #e9e5f8;
      color: #34205f;
    }

    .secondary-button:hover {
      background: #d9d1f3;
    }

    .hidden {
      display: none !important;
    }

    #status {
      margin: 12px 0;
      font-weight: bold;
    }

    #authStatus {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    #chat {
      height: 280px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-top: 16px;
      background: #fafafa;
      overflow-wrap: anywhere;
    }

    .message {
      padding: 8px;
      margin: 6px 0;
      border-radius: 5px;
      background: #eee;
    }

    .system-message {
      color: #555;
      font-style: italic;
    }

    .error-message {
      color: #b42318;
    }

    .success-message {
      color: #16803c;
    }

    .auth-section {
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #messageForm {
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <h1>Distributed Chat</h1>

    <!-- Login and registration -->
    <section id="authSection" class="auth-section">
      <div class="button-row">
        <button id="showLoginButton" type="button">
          Login
        </button>

        <button
          id="showRegisterButton"
          type="button"
          class="secondary-button"
        >
          Create Account
        </button>
      </div>

      <!-- Login form -->
      <form id="loginForm">
        <h2>Welcome Back</h2>

        <label for="loginEmail">Email</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required
        >

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button id="loginButton" type="submit">
          Login
        </button>
      </form>

      <!-- Registration form -->
      <form id="registerForm" class="hidden">
        <h2>Create Your Account</h2>

        <label for="registerUsername">Username</label>
        <input
          id="registerUsername"
          type="text"
          autocomplete="username"
          maxlength="20"
          placeholder="Choose a username"
          required
        >

        <label for="registerEmail">Email</label>
        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required
        >

        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Create a password"
          required
        >

        <button id="registerButton" type="submit">
          Register
        </button>
      </form>

      <p id="authStatus" aria-live="polite"></p>
    </section>

    <!-- Authenticated user information -->
    <section id="userSection" class="hidden">
      <p>
        Logged in as <strong id="currentUsername"></strong>
      </p>

      <button id="logoutButton" type="button">
        Logout
      </button>
    </section>

    <p id="status" aria-live="polite">
      Please log in to connect to the chat.
    </p>

    <!-- Chat interface -->
    <section id="chatSection" class="hidden">
      <form id="messageForm">
        <label for="msg">Your message</label>

        <input
          id="msg"
          type="text"
          placeholder="Type a message..."
          maxlength="500"
          autocomplete="off"
        >

        <button id="sendButton" type="submit" disabled>
          Send
        </button>
      </form>

      <div id="chat" aria-live="polite"></div>
    </section>
  </div>

  <script>
    // Production Node A WebSocket server.
    const SERVER_URL = 'wss://chat-node-a.onrender.com';

    // Production authentication API.
    const AUTH_API_URL = 'https://chat-auth-api.onrender.com/api';

    // HTML elements.
    const authSection = document.getElementById('authSection');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    const showLoginButton =
      document.getElementById('showLoginButton');

    const showRegisterButton =
      document.getElementById('showRegisterButton');

    const loginButton = document.getElementById('loginButton');
    const registerButton = document.getElementById('registerButton');

    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');

    const registerUsername =
      document.getElementById('registerUsername');

    const registerEmail =
      document.getElementById('registerEmail');

    const registerPassword =
      document.getElementById('registerPassword');

    const authStatus = document.getElementById('authStatus');
    const userSection = document.getElementById('userSection');
    const currentUsername =
      document.getElementById('currentUsername');

    const logoutButton = document.getElementById('logoutButton');
    const chatSection = document.getElementById('chatSection');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('msg');
    const sendButton = document.getElementById('sendButton');
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');

    // WebSocket state.
    let socket = null;
    let reconnectTimer = null;
    let reconnecting = false;
    let isAuthenticated = false;

    const RECONNECT_DELAY = 2000;

    // The username is obtained from the authenticated server response.
    let authenticatedUsername = '';

    function getToken() {
      return sessionStorage.getItem('chatToken');
    }

    function displayMessage(text, isSystemMessage = false) {
      const paragraph = document.createElement('p');

      paragraph.className = isSystemMessage
        ? 'system-message'
        : 'message';

      // Display plain text rather than interpreting HTML.
      paragraph.textContent = String(text);

      chat.appendChild(paragraph);
      chat.scrollTop = chat.scrollHeight;
    }

    function setAuthStatus(message, type = '') {
      authStatus.textContent = message;
      authStatus.className = type;
    }

    function showLogin() {
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      setAuthStatus('');
    }

    function showRegistration() {
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      setAuthStatus('');
    }

    showLoginButton.addEventListener('click', showLogin);
    showRegisterButton.addEventListener(
      'click',
      showRegistration
    );

    async function postAuthRequest(endpoint, payload) {
      const response = await fetch(
        `${AUTH_API_URL}/${endpoint}`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error ||
          `Request failed with status ${response.status}`
        );
      }

      return data;
    }

    function saveLogin(data) {
      // Support the token field returned by the authentication API.
      const token = data.token || data.access_token;

      if (typeof token !== 'string' || token.length === 0) {
        throw new Error(
          'The API did not return a JWT token. Check authServer.js.'
        );
      }

      sessionStorage.setItem('chatToken', token);

      authenticatedUsername =
        data.user?.username ||
        data.username ||
        '';

      authSection.classList.add('hidden');
      userSection.classList.remove('hidden');
      chatSection.classList.remove('hidden');

      currentUsername.textContent =
        authenticatedUsername || 'Authenticated user';

      setAuthStatus('');
      isAuthenticated = false;

      connectToServer();
    }

    // Login with an existing account.
    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginButton.disabled = true;
      setAuthStatus('Logging in...');

      try {
        const data = await postAuthRequest('login', {
          email: loginEmail.value.trim(),
          password: loginPassword.value
        });

        saveLogin(data);
      } catch (error) {
        setAuthStatus(error.message, 'error-message');
      } finally {
        loginButton.disabled = false;
      }
    });

    // Register a new account, then log in if registration
    // does not itself return a JWT.
    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      registerButton.disabled = true;
      setAuthStatus('Creating your account...');

      const username = registerUsername.value.trim();
      const email = registerEmail.value.trim();
      const password = registerPassword.value;

      try {
        let data = await postAuthRequest('register', {
          username,
          email,
          password
        });

        const token = data.token || data.access_token;

        if (typeof token === 'string' && token.length > 0) {
          saveLogin(data);
        } else {
          // Some APIs register users but require a separate login.
          setAuthStatus(
            'Account created. Logging you in...',
            'success-message'
          );

          data = await postAuthRequest('login', {
            email,
            password
          });

          saveLogin(data);
        }

        registerPassword.value = '';
      } catch (error) {
        setAuthStatus(error.message, 'error-message');
      } finally {
        registerButton.disabled = false;
      }
    });

    function connectToServer() {
      const token = getToken();

      if (!token) {
        return;
      }

      if (
        socket &&
        (socket.readyState === WebSocket.CONNECTING ||
         socket.readyState === WebSocket.OPEN)
      ) {
        return;
      }

      reconnecting = false;
      isAuthenticated = false;

      status.textContent = 'Connecting and authenticating...';
      status.style.color = '#a66b00';
      sendButton.disabled = true;

      const newSocket = new WebSocket(SERVER_URL);
      socket = newSocket;

      newSocket.addEventListener('open', () => {
        if (socket !== newSocket) return;

        // Authenticate immediately after opening the connection.
        newSocket.send(JSON.stringify({
          type: 'auth',
          token
        }));

        status.textContent = 'Authenticating with Node A...';
        status.style.color = '#a66b00';

        if (reconnectTimer !== null) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }

        reconnecting = false;
      });

      newSocket.addEventListener('message', (event) => {
        if (socket !== newSocket) return;

        const received = String(event.data);

        // The server sends JSON for authentication success,
        // but regular chat messages remain plain text.
        try {
          const packet = JSON.parse(received);

          if (packet.type === 'auth_success') {
            isAuthenticated = true;

            authenticatedUsername =
              packet.user?.username ||
              authenticatedUsername;

            currentUsername.textContent =
              authenticatedUsername || 'Authenticated user';

            status.textContent = 'Authenticated and connected to Node A';
            status.style.color = 'green';

            sendButton.disabled = false;

            displayMessage(
              'Successfully authenticated with the chat server.',
              true
            );

            return;
          }

          if (packet.type === 'auth_error') {
            displayMessage(
              packet.message || 'Authentication failed.',
              true
            );
            return;
          }
        } catch (error) {
          // This is a normal text chat message, not a JSON packet.
        }

        displayMessage(received);
      });

      newSocket.addEventListener('close', (event) => {
        if (socket !== newSocket) return;

        isAuthenticated = false;
        sendButton.disabled = true;

        if (event.code === 1008) {
          // A policy close commonly means the token was rejected.
          sessionStorage.removeItem('chatToken');

          status.textContent =
            'Authentication rejected. Please log in again.';
          status.style.color = 'red';

          authSection.classList.remove('hidden');
          userSection.classList.add('hidden');
          chatSection.classList.add('hidden');

          displayMessage(
            'The server rejected authentication. Please log in again.',
            true
          );

          showLogin();
          return;
        }

        status.textContent = 'Disconnected. Reconnecting...';
        status.style.color = 'red';

        displayMessage(
          'Connection closed. Trying to reconnect...',
          true
        );

        if (getToken()) {
          scheduleReconnect();
        }
      });

      newSocket.addEventListener('error', (error) => {
        console.error('WebSocket connection error:', error);

        status.textContent = 'Connection error.';
        status.style.color = 'red';
      });
    }

    function scheduleReconnect() {
      if (reconnecting || reconnectTimer !== null || !getToken()) {
        return;
      }

      reconnecting = true;

      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        reconnecting = false;
        connectToServer();
      }, RECONNECT_DELAY);
    }

    function sendMessage(event) {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN ||
        !isAuthenticated
      ) {
        displayMessage(
          'Cannot send: please wait for authentication.',
          true
        );
        return;
      }

      // Send only the message text. Node A adds the verified username.
      socket.send(message);

      messageInput.value = '';
      messageInput.focus();
    }

    messageForm.addEventListener('submit', sendMessage);

    logoutButton.addEventListener('click', () => {
      // Remove the token before closing so reconnect is not scheduled.
      sessionStorage.removeItem('chatToken');

      isAuthenticated = false;
      authenticatedUsername = '';
      sendButton.disabled = true;

      if (reconnectTimer !== null) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      reconnecting = false;

      if (
        socket &&
        socket.readyState !== WebSocket.CLOSED
      ) {
        const oldSocket = socket;
        socket = null;
        oldSocket.close(1000, 'User logged out');
      }

      authSection.classList.remove('hidden');
      userSection.classList.add('hidden');
      chatSection.classList.add('hidden');

      status.textContent = 'Logged out. Please log in to reconnect.';
      status.style.color = '';

      loginPassword.value = '';
      registerPassword.value = '';

      showLogin();
    });

    sendButton.disabled = true;

    // Restore the session after a page refresh if a token exists.
    if (getToken()) {
      authSection.classList.add('hidden');
      userSection.classList.remove('hidden');
      chatSection.classList.remove('hidden');

      status.textContent = 'Restoring your session...';
      connectToServer();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
